name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rem
          POSTGRES_PASSWORD: rem
          POSTGRES_DB: rem_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rem"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://rem:rem@localhost:5432/rem_test
      DATABASE_URL: postgres://rem:rem@localhost:5432/rem_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
